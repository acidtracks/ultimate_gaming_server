# Ultimate Gaming Server — configuration
#
# Résolution et fréquence du moniteur virtuel de streaming.
# Modifiable sans reconstruire le paquet.
STREAM_WIDTH=1920
STREAM_HEIGHT=1080
STREAM_REFRESH=60

# Port DFP NVIDIA utilisé pour le moniteur virtuel (doit être déconnecté).
# DFP-1 : DisplayPort interne, 2670 MHz max — supporte 4K/240 Hz.
VIRTUAL_DFP=DP-0
