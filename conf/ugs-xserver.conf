# Xorg — display virtuel NVIDIA pour le streaming
#
# ConnectedMonitor force NVIDIA à activer DFP-1 (port DP libre) comme
# affichage virtuel. UseDisplayDevice restreint X :1 à ce seul port.
# MetaModes liste toutes les résolutions de streaming supportées.

Section "Device"
    Identifier  "NVIDIADevice"
    Driver      "nvidia"
    Option      "ConnectedMonitor"  "DFP-1"
    Option      "UseDisplayDevice"  "DFP-1"
    Option      "ModeValidation"    "DFP-1: NoEdidModes, AllowNonEdidModes, NoMaxPClkCheck, NoHorizSyncCheck, NoVertRefreshCheck"
EndSection

Section "Monitor"
    Identifier  "VirtualMonitor"
    HorizSync   1-1000
    VertRefresh 1-1000
    Modeline "3216x1440_144.00"  1014.50  3216 3504 3856 4496  1440 1443 1453 1568 -hsync +vsync
    Modeline "3216x1440_120.00"   830.50  3216 3496 3848 4480  1440 1443 1453 1545 -hsync +vsync
    Modeline "3216x1440_90.00"    607.50  3216 3480 3832 4448  1440 1443 1453 1519 -hsync +vsync
    Modeline "3216x1440_60.00"    392.50  3216 3456 3800 4384  1440 1443 1453 1493 -hsync +vsync
    Modeline "2560x1440_144.00"   808.75  2560 2792 3072 3584  1440 1443 1448 1568 -hsync +vsync
    Modeline "2560x1440_120.00"   661.25  2560 2784 3064 3568  1440 1443 1448 1545 -hsync +vsync
    Modeline "2560x1440_90.00"    483.00  2560 2768 3048 3536  1440 1443 1448 1519 -hsync +vsync
    Modeline "2560x1440_60.00"    312.25  2560 2752 3024 3488  1440 1443 1448 1493 -hsync +vsync
    Modeline "1920x1080_144.00"   452.50  1920 2088 2296 2672  1080 1083 1088 1177 -hsync +vsync
    Modeline "1920x1080_120.00"   369.50  1920 2080 2288 2656  1080 1083 1088 1160 -hsync +vsync
    Modeline "1920x1080_90.00"    269.00  1920 2064 2272 2624  1080 1083 1088 1140 -hsync +vsync
    Modeline "1920x1080_60.00"    173.00  1920 2048 2248 2576  1080 1083 1088 1120 -hsync +vsync
    Modeline "1280x720_144.00"    198.75  1280 1384 1520 1760   720  723  728  786 -hsync +vsync
    Modeline "1280x720_120.00"    162.00  1280 1376 1512 1744   720  723  728  775 -hsync +vsync
    Modeline "1280x720_90.00"     117.00  1280 1360 1496 1712   720  723  728  761 -hsync +vsync
    Modeline "1280x720_60.00"      74.50  1280 1344 1472 1664   720  723  728  748 -hsync +vsync
EndSection

Section "Screen"
    Identifier  "NVIDIAScreen"
    Device      "NVIDIADevice"
    Monitor     "VirtualMonitor"
    DefaultDepth 24
    Option "MetaModes" "DFP-1: 3216x1440_144.00 +0+0; DFP-1: 3216x1440_120.00 +0+0; DFP-1: 3216x1440_90.00 +0+0; DFP-1: 3216x1440_60.00 +0+0; DFP-1: 2560x1440_144.00 +0+0; DFP-1: 2560x1440_120.00 +0+0; DFP-1: 2560x1440_90.00 +0+0; DFP-1: 2560x1440_60.00 +0+0; DFP-1: 1920x1080_144.00 +0+0; DFP-1: 1920x1080_120.00 +0+0; DFP-1: 1920x1080_90.00 +0+0; DFP-1: 1920x1080_60.00 +0+0; DFP-1: 1280x720_144.00 +0+0; DFP-1: 1280x720_120.00 +0+0; DFP-1: 1280x720_90.00 +0+0; DFP-1: 1280x720_60.00 +0+0"
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection
